name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Enable pnpm
        run: |
          npm install -g corepack@latest
          corepack enable pnpm
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt,clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy -p zk_election -- -D warnings
      - name: Rust tests
        run: cargo test -p zk_election
      - name: Type check
        run: pnpm typecheck
      - name: Package tests
        run: pnpm --filter "./packages/*" test
      - name: No passport data in the repo
        run: |
          ! git ls-files | grep -E '(^|/)passport-data/|\.passport\.json$'
